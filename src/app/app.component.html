<header class="site-header">
  <a class="brand" routerLink="/" (click)="closeMenu()">
    <i class="brand-mark fa-solid fa-book-atlas" aria-hidden="true"></i>
    <span class="brand-name">Mis Mundos</span>
  </a>

  <button
    type="button"
    class="nav-toggle"
    [class.is-active]="menuOpen"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen"
    aria-controls="site-nav"
    aria-label="Abrir menú">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav class="site-nav" id="site-nav" [class.is-open]="menuOpen">
    <a
      routerLink="/"
      routerLinkActive="is-current"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
      class="nav-link">
      <i class="nav-icon fa-solid fa-house" aria-hidden="true"></i> Inicio
    </a>

    <div class="nav-group">
      <span class="nav-link nav-group-label">
        <i class="nav-icon fa-solid fa-book" aria-hidden="true"></i> Proyectos
      </span>
      <div class="nav-submenu">
        <a routerLink="/inmortal" routerLinkActive="is-current" (click)="closeMenu()" class="nav-sublink">
          <i class="nav-icon fa-solid fa-khanda" aria-hidden="true"></i> Inmortal
        </a>
        <a routerLink="/las-trece-puertas" routerLinkActive="is-current" (click)="closeMenu()" class="nav-sublink">
          <i class="nav-icon fa-solid fa-door-open" aria-hidden="true"></i> Las trece puertas
        </a>
        <a routerLink="/azalon" routerLinkActive="is-current" (click)="closeMenu()" class="nav-sublink">
          <i class="nav-icon fa-solid fa-wand-sparkles" aria-hidden="true"></i> Azalon
        </a>
      </div>
    </div>

    <a routerLink="/sobremi" routerLinkActive="is-current" (click)="closeMenu()" class="nav-link">
      <i class="nav-icon fa-solid fa-feather-pointed" aria-hidden="true"></i> Sobre mí
    </a>
  </nav>

  <button
    type="button"
    class="nav-backdrop"
    [class.is-visible]="menuOpen"
    (click)="closeMenu()"
    aria-hidden="true"
    tabindex="-1">
  </button>
</header>

<main class="fantasy-bg">
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>
