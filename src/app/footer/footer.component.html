<footer class="site-footer">
  <div class="footer-inner">
    <p class="footer-copy">&copy; {{ currentYear }} Javier Pérez Palomino. Todos los derechos reservados.</p>
    @if (email || instagramUrl) {
      <div class="footer-links">
        @if (email) {
          <a [href]="'mailto:' + email" class="footer-link">{{ email }}</a>
        }
        @if (instagramUrl) {
          <a [href]="instagramUrl" target="_blank" rel="noopener" class="footer-link">Instagram</a>
        }
      </div>
    }
  </div>
</footer>
